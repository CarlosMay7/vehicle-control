version: "3.9"

services:
  frontend:
    build:
      context: ./front-end
    ports:
      - "5173:80"
    env_file:
      - ./front-end/.env
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./back-end
    ports:
      - "3000:3000"
    env_file:
      - ./back-end/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
